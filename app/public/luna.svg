<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="moonTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9eb0ab" />
      <stop offset="50%" stop-color="#738682" />
      <stop offset="100%" stop-color="#4a5e59" />
    </linearGradient>

    <mask id="crescentMask">
      <rect width="120" height="120" fill="white" />
      <circle cx="35" cy="60" r="45" fill="black" />
    </mask>
  </defs>

  <circle cx="60" cy="60" r="46" fill="#ffe8b3" mask="url(#crescentMask)" filter="url(#glow)" opacity="0.9" />

  <g mask="url(#crescentMask)">
    <circle cx="60" cy="60" r="45" fill="url(#moonTexture)" />

    <g stroke="#b4c0b9" stroke-width="1" opacity="0.85">
      <circle cx="70" cy="30" r="5" fill="#1b2a26" />
      <circle cx="95" cy="55" r="7" fill="#1b2a26" />
      <circle cx="80" cy="85" r="4.5" fill="#1b2a26" />
      <circle cx="65" cy="48" r="3" fill="#1b2a26" />
      <circle cx="85" cy="68" r="5.5" fill="#1b2a26" />
      <circle cx="60" cy="75" r="2.5" fill="#1b2a26" stroke-width="0.5"/>
      <circle cx="75" cy="18" r="3.5" fill="#1b2a26" />
    </g>

    <g fill="#1b2a26" opacity="0.7">
      <circle cx="88" cy="40" r="1.5" />
      <circle cx="78" cy="22" r="1" />
      <circle cx="98" cy="72" r="1.2" />
      <circle cx="82" cy="35" r="1" />
      <circle cx="70" cy="70" r="1.5" />
      <circle cx="88" cy="80" r="1" />
      <circle cx="72" cy="40" r="0.8" />
      <circle cx="90" cy="28" r="1.2" />
    </g>
  </g>
</svg>
